<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Refer Questions - Coding Exam Platform</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
<link href="css/style.css" rel="stylesheet" />
</head>
<body>

<nav class="navbar navbar-dark bg-brand mb-4">
  <div class="container-fluid">
    <a href="student-dashboard.html" class="navbar-brand"><i class="bi bi-arrow-left me-2"></i>Back to Dashboard</a>
    <button class="btn btn-outline-light btn-sm" data-logout="true"><i class="bi bi-box-arrow-right me-1"></i>Logout</button>
  </div>
</nav>

<div class="container pb-5" id="pageBody">
  <div class="text-muted">Loading...</div>
</div>

<template id="tmplLoaded">
  <div class="alert alert-dark d-flex align-items-center gap-2 mb-4">
    <i class="bi bi-info-circle-fill fs-5"></i>
    <div>
      <strong>Reference Only.</strong> You were marked <strong>Absent</strong> for this exam, so these questions are shown for review and practice. This page does not accept answers, start a new attempt, or record any score.
    </div>
  </div>

  <div class="mb-4">
    <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
      <div>
        <h4 class="fw-bold mb-1" id="examTitle"></h4>
        <p class="text-muted mb-0" id="examDesc"></p>
      </div>
      <span class="badge exam-type-badge" id="examTypeBadge"></span>
    </div>
  </div>

  <div id="questionsWrap" class="d-flex flex-column gap-3"></div>
</template>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="js/refer-questions.js"></script>
</body>
</html>
