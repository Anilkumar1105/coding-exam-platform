<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="maintenance.js"></script>
  <title>Code Visualizations Lab - Coding Exam Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="style.css" rel="stylesheet" />
  <link href="code-visualizations.css" rel="stylesheet" />
</head>
<body class="learning-body">
  <nav class="navbar navbar-dark bg-brand mb-4">
    <div class="container-fluid">
      <a href="student-dashboard.html" class="navbar-brand"><i class="bi bi-arrow-left me-2"></i>Back to Dashboard</a>
      <button class="btn btn-outline-light btn-sm" data-logout="true"><i class="bi bi-box-arrow-right me-1"></i>Logout</button>
    </div>
  </nav>
  <main class="container pb-5">
    <div id="visualizationsRoot"><div class="text-muted py-4">Loading Code Visualizations Lab…</div></div>
  </main>
  <script type="module">
    import { requireRole, wireLogoutButtons } from "./auth.js";
    import { renderCodeVisualizations } from "./code-visualizations.js";
    wireLogoutButtons();
    requireRole("student", () => renderCodeVisualizations(document.getElementById("visualizationsRoot")));
  </script>
</body>
</html>
