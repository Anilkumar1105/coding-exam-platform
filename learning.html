<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Learning - Coding Exam Platform</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
<link href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" rel="stylesheet" />
<link href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css" rel="stylesheet" />
<link href="style.css" rel="stylesheet" />
</head>
<body>

<nav class="navbar navbar-dark bg-brand mb-4">
  <div class="container-fluid">
    <a href="student-dashboard.html" class="navbar-brand"><i class="bi bi-arrow-left me-2"></i>Back to Dashboard</a>
    <button class="btn btn-outline-light btn-sm" data-logout="true"><i class="bi bi-box-arrow-right me-1"></i>Logout</button>
  </div>
</nav>

<div class="container pb-5" id="pageBody">
  <div class="text-muted">Loading level...</div>
</div>

<template id="tmplLoaded">
  <div class="mb-4">
    <h4 class="fw-bold mb-1" id="levelTitle"></h4>
    <p class="text-muted mb-0" id="levelDesc"></p>
  </div>

  <div class="row g-3">
    <div class="col-lg-3">
      <div class="card p-2">
        <div class="fw-semibold small mb-2 text-muted px-1">LEARNING PATH</div>
        <div id="learningNav" class="d-flex flex-column gap-1"></div>
      </div>
    </div>
    <div class="col-lg-9">
      <div class="card p-3" id="learningContent"></div>
    </div>
  </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script type="module" src="learning-page.js"></script>
</body>
</html>
